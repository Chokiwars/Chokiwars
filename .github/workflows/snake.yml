name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Chokiwars
          outputs: |
            dist/github-contribution-grid-snake.svg?pattern=zigzag&speed=1.6&color_snake=#9333ea&color_dots=#f3e8ff,#e9d5ff,#c4b5fd,#8b5cf6,#6d28d9
            dist/github-contribution-grid-snake-dark.svg?pattern=spiral&speed=1.8&color_snake=#22d3ee&color_dots=#020617,#0f172a,#164e63,#0891b2,#67e8f9


      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
